<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <title>Wielka Planeta 2.0</title>
    <style>
        a {
            color: white;
            padding: 4px
        }

        #canvas {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        html,
        body {
            overflow: hidden;
        }
    </style>
</head>

<body>
    <h1 id="wznowGre" style="position: absolute;top: 189px;left: 381px;font-size: 75px"><a href
            style="text-decoration: none;">WZNÓW GRĘ</a></h1>
    <canvas id="canvas"></canvas>
    <script>
        const STARTTIME = Date.now();
        const canvas = document.getElementById("canvas");;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext("2d");
        const SZER = canvas.width;
        const WYS = canvas.height;
        const CENTERX = canvas.width / 2;
        const CENTERY = canvas.height / 2;
        const LEWA = 37;
        const GORA = 38;
        const PRAWA = 39;
        const DOL = 40;
        const ESC = 27;
        const LICZBAGWIAZDEK = 150;
        const LICZBAPLANET = 11;//bo z graczem
        let reqId;
        let pauza = false;
        let kierunek = 0;
        let gwiazdki = [];
        let planety = [];



        $("#wznowGre").hide();

        for (let i = 0; i <= LICZBAGWIAZDEK; i++) {
            gwiazdki.push({
                x: Math.floor(Math.random() * SZER),
                y: Math.floor(Math.random() * WYS),
                z: Math.random() * 0.1
            });
        };

        let rysujNiebo = function () {
            gwiazdki.forEach(gwiazdka => {
                ctx.beginPath();
                ctx.fillStyle = "white";
                ctx.arc(gwiazdka.x + gracz.x * gwiazdka.z, gwiazdka.y + gracz.y * gwiazdka.z, 45 * gwiazdka.z, 0, 2 * Math.PI);
                ctx.fill();
            });
        };

        let tekst = function (tekst, x, y, rozmiar, kolor) {
            ctx.fillStyle = kolor;
            ctx.textAlign = "center"
            ctx.font = `${rozmiar}px degolan`;
            ctx.fillText(tekst, x, y);
        };

        let Planeta = function (x, y, promien) {
            this.x = x;
            this.y = y;
            this.promien = promien
            this.PREDKOSC = 0.25
        };

        let gracz = new Planeta(100, 100, 50);
        planety.push(gracz);
        while (planety.length < LICZBAPLANET) {
            let nowyPromien = Math.floor(Math.random() * 70) + 40;
            let nowyX = Math.floor(Math.random() * SZER - nowyPromien);
            let nowyY = Math.floor(Math.random() * WYS - nowyPromien);
            let kolizja = false;
            if (nowyX < nowyPromien) {
                nowyX += nowyPromien
            }
            if (Math.abs(50 - nowyX) < nowyPromien + 50) {
                nowyX += nowyPromien
            }
            if (nowyY < nowyPromien) {
                nowyY += nowyPromien
            }
            if (Math.abs(50 - nowyY) < nowyPromien + 50) {
                nowyY += nowyPromien
            }
            planety.forEach(element => {
                if (Math.abs(element.x - nowyX) < element.promien + nowyPromien &&
                    Math.abs(element.y - nowyY) < element.promien + nowyPromien) {
                    kolizja = true
                }
            });
            if (!kolizja) {
                planety.push(new Planeta(nowyX, nowyY, nowyPromien));
            }

        };

        Planeta.prototype.przesuwaj = function (kierunek, timeDiff) {
            if (kierunek[GORA] && !(this.y < this.promien + 10)) {
                this.y -= this.PREDKOSC * timeDiff
            }
            if (kierunek[DOL] && !(this.y > WYS - this.promien - 10)) {
                this.y += this.PREDKOSC * timeDiff
            }
            if (kierunek[LEWA] && !(this.x < this.promien + 10)) {
                this.x -= this.PREDKOSC * timeDiff
            }
            if (kierunek[PRAWA] && !(this.x > SZER - this.promien - 10)) {
                this.x += this.PREDKOSC * timeDiff
            };
        };

        Planeta.prototype.rysuj = function (numerPlanety) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.promien, 0, Math.PI * 2);
            ctx.fillStyle = "magenta"; //placeholder
            ctx.fill();
            if (numerPlanety === 0) {
                tekst("PLACEHOLDER GRACZ", this.x, this.y, this.promien * 0.20, "white");
            } else {
                tekst(`PLACEHOLDER ${numerPlanety}`, this.x, this.y, this.promien * 0.25, "white");
            }
        };

        let map = { 37: false, 38: false, 39: false, 40: false };
        $(document).keydown(function (zdarzenie) {
            if (zdarzenie.keyCode in map) {
                map[zdarzenie.keyCode] = true;
                kierunek = map;
            };
        }).keyup(function (zdarzenie) {
            if (zdarzenie.keyCode in map) {
                map[zdarzenie.keyCode] = false;
            }
        });

        $(document).keydown(function (zdarzenie) {
            if (zdarzenie.keyCode === ESC) {
                pauza = true;
            }
        });

        let gra = function (lastTime) {
            let time = Date.now();
            let timeDiff = time - lastTime;
            ctx.clearRect(0, 0, SZER, WYS);
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, SZER, WYS);
            gracz.przesuwaj(kierunek, timeDiff);
            rysujNiebo(gracz.newX, gracz.newY);
            planety.forEach(planeta => {
                planeta.rysuj(planety.indexOf(planeta));
            });

            if (pauza === false) {
                reqId = window.requestAnimationFrame(function () {
                    gra(time);
                })
            } else if (pauza === true) {
                tekst("PAUZA", CENTERX, CENTERY - 150, 100, "white");
                $("#wznowGre").show();
                $("#wznowGre").hover(function () {
                    ;
                    $("#wznowGre a").css("background-color", "white");
                    $("#wznowGre a").css("color", "black");
                }, function () {
                    $("#wznowGre a").css("color", "white");
                    $("#wznowGre a").css("background", "none");
                });

                $("#wznowGre").click(function () {
                    pauza = false;
                    gra(time);
                    $("#wznowGre").hide();
                });
            };
        };

        gra(STARTTIME);
    </script>
</body>

</html>
